[project]
name = "pilot-credit-hedging"
version = "0.1.0"
description = "JAX infrastructure for a five-year credit bond hedged with rolling six-month CDS"
requires-python = ">=3.11"
dependencies = ["jax>=0.7,<0.8", "equinox>=0.13,<0.14", "chex>=0.1.88", "optax>=0.2.4", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
